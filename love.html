<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    overflow:hidden;
    font-family:Arial,sans-serif;
}


/* الكلام */
h1{
    color:white;
    font-size:55px;
    opacity:0;
    animation:text 2s forwards;
    text-shadow:0 0 20px white;
}

@keyframes text{

    from{
        opacity:0;
        transform:translateY(-100px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* القلب */
.heart{

    width:150px;
    height:150px;
    background:#ff1744;
    position:relative;
    transform:rotate(-45deg);
    margin-top:80px;
    animation:beat 1s infinite;
    box-shadow:0 0 40px #ff1744;

}


.heart:before,
.heart:after{

    content:"";
    width:150px;
    height:150px;
    background:#ff1744;
    border-radius:50%;
    position:absolute;

}


.heart:before{
    top:-75px;
    left:0;
}


.heart:after{
    left:75px;
    top:0;
}


@keyframes beat{

    0%{
        transform:rotate(-45deg) scale(1);
    }

    50%{
        transform:rotate(-45deg) scale(1.2);
    }

    100%{
        transform:rotate(-45deg) scale(1);
    }

}


/* النجوم */

.star{

    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:shine 2s infinite alternate;

}


@keyframes shine{

    from{
        opacity:.2;
    }

    to{
        opacity:1;
    }

}

</style>

</head>


<body>


<h1>I Love you body 🤍</h1>


<div class="heart"></div>



<script>


// رسم النجوم

for(let i=0;i<150;i++){

    let star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"vw";

    star.style.top=Math.random()*100+"vh";

    star.style.animationDuration=(1+Math.random()*3)+"s";

    document.body.appendChild(star);

}


</script>


</body>
</html>
